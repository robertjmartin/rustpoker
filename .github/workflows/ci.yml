name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests + full e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Rust unit tests
        working-directory: server
        run: cargo test --workspace

      # No npm install: the e2e suite has no dependencies. The runner builds
      # pokerserver itself, so the tested binary always matches the checkout.
      - name: Full e2e suite
        working-directory: server/e2e
        run: npm run test:full
