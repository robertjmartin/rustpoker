<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rustpoker test client</title>
<style>
:root{
  --bg:#f3f4f1; --panel:#ffffff; --ink:#1c2420; --muted:#66706a; --line:#d9ddd6;
  --felt:#1f6b4a; --felt-ink:#ffffff; --out:#1f6b4a; --in:#8a5a00; --err:#b3261e; --push:#5b4bb3;
  --logbg:#fbfbf9; --focus:#2a7fff;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141815; --panel:#1c221e; --ink:#e6ebe7; --muted:#92a097; --line:#2c342f;
  --felt:#3aa675; --felt-ink:#07140d; --out:#5fcf9b; --in:#e0b45a; --err:#ff8a80; --push:#b3a8ff; --logbg:#111512; --focus:#6aa8ff;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:650}
.pill{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--err)}
.dot.on{background:var(--felt)}
main{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:16px;padding:16px;height:calc(100vh - 51px)}
@media (max-width:820px){main{grid-template-columns:1fr;height:auto}}
.controls{overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:2px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
section h2{font-size:13px;margin:0 0 8px;font-weight:650}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input,textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit}
input.mono,textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:flex-end}
.row>.grow{flex:1;min-width:110px}
.row label{margin-top:0}
button{padding:6px 11px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
button:hover:not(:disabled){border-color:var(--felt)}
button.primary{background:var(--felt);color:var(--felt-ink);border-color:var(--felt);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.logwrap{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.logbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.logbar strong{font-weight:650;font-size:13px}
.logbar .sp{flex:1}
#log{flex:1;overflow:auto;margin:0;padding:8px 12px;background:var(--logbg);font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:300px}
.ln{padding:3px 0;border-bottom:1px dashed var(--line);white-space:pre-wrap;word-break:break-all}
.ln .t{color:var(--muted);margin-right:8px}
.ln .tag{display:inline-block;min-width:44px;font-weight:700;margin-right:6px}
.ln.out .tag{color:var(--out)} .ln.in .tag{color:var(--in)} .ln.err .tag{color:var(--err)} .ln.push .tag{color:var(--push)} .ln.sys{color:var(--muted)}
.ln .ms{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>rustpoker test client</h1>
  <div class="pill"><span class="dot" id="dot"></span><span id="status">Disconnected</span></div>
</header>
<main>
<div class="controls">

  <section>
    <h2>Server</h2>
    <label for="host">Host and port</label>
    <input id="host" class="mono" value="localhost:3000">
    <div class="row">
      <button id="btnPing">Ping</button>
      <button id="btnCount">User count</button>
    </div>
  </section>

  <section>
    <h2>User</h2>
    <label for="name">Name</label>
    <div class="row" style="margin-top:0">
      <input id="name" class="grow" value="alice" style="flex:1">
      <button id="btnReg" class="primary">Register</button>
    </div>
    <label for="userId">User ID</label>
    <input id="userId" class="mono" placeholder="uuid from /register">
    <div class="row"><button id="btnGetUser">Get user</button></div>
  </section>

  <section>
    <h2>WebSocket session</h2>
    <div class="row" style="margin-top:0">
      <button id="btnConnect" class="primary">Connect</button>
      <button id="btnDisconnect" disabled>Disconnect</button>
    </div>
    <div class="row">
      <button class="ws" id="btnSetAuth">setAuthentication</button>
      <button class="ws" id="btnGetAuth">getAuthentication</button>
    </div>
  </section>

  <section>
    <h2>Table</h2>
    <label for="tableId">Table ID</label>
    <div class="row" style="margin-top:0">
      <input id="tableId" class="mono grow" value="00000000-0000-0000-0000-000000000000" style="flex:1">
      <button id="btnNewTable">New</button>
    </div>
    <p class="hint">The server ignores the table ID for now, but it must be a valid UUID.</p>
    <div class="row">
      <button class="ws" id="btnJoin">joinTable</button>
      <button class="ws" id="btnLeave">leaveTable</button>
    </div>
    <div class="row">
      <div class="grow"><label for="bank">Bank amount</label><input id="bank" type="number" min="0" value="500"></div>
      <button class="ws" id="btnSit">sit</button>
      <button class="ws" id="btnStand">stand</button>
    </div>
    <div class="row">
      <div class="grow"><label for="bet">Bet amount</label><input id="bet" type="number" min="0" value="50"></div>
      <button class="ws" id="btnBet">bet</button>
      <button class="ws" id="btnFold">fold</button>
    </div>
  </section>

  <section>
    <h2>Raw message</h2>
    <label for="raw">JSON (an <code>id</code> is added if missing)</label>
    <textarea id="raw" rows="4" spellcheck="false">{"command":"getAuthentication"}</textarea>
    <div class="row"><button class="ws" id="btnRaw">Send</button><button class="ws" id="btnBad">Send invalid JSON</button></div>
    <p class="hint">Invalid messages get no reply from the server; that is expected.</p>
  </section>

</div>

<div class="logwrap">
  <div class="logbar">
    <strong>Log</strong>
    <span class="sp"></span>
    <label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="scroll" checked style="width:auto"> Auto-scroll</label>
    <button id="btnClear">Clear</button>
  </div>
  <div id="log" aria-live="polite"></div>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
let ws = null, seq = 0;
const pending = new Map(); // id -> {label, t0}

function stamp(){ return new Date().toLocaleTimeString([], {hour12:false}) }
function log(kind, tag, text, extra){
  const d = document.createElement('div');
  d.className = 'ln ' + kind;
  const t = document.createElement('span'); t.className='t'; t.textContent = stamp();
  const g = document.createElement('span'); g.className='tag'; g.textContent = tag;
  d.append(t, g, document.createTextNode(text));
  if (extra){ const m=document.createElement('span'); m.className='ms'; m.textContent='  '+extra; d.append(m); }
  $('log').append(d);
  if ($('scroll').checked) $('log').scrollTop = $('log').scrollHeight;
}
const pretty = o => { try { return JSON.stringify(typeof o==='string'?JSON.parse(o):o) } catch { return String(o) } };

function setConnected(on){
  $('dot').classList.toggle('on', on);
  $('status').textContent = on ? 'Connected' : 'Disconnected';
  $('btnConnect').disabled = on;
  $('btnDisconnect').disabled = !on;
  document.querySelectorAll('button.ws').forEach(b => b.disabled = !on);
}

/* ---------- HTTP ---------- */
const base = () => 'http://' + $('host').value.trim();
async function http(method, path, body){
  const url = base() + path;
  log('out','HTTP', method + ' ' + path + (body ? ' ' + JSON.stringify(body) : ''));
  const t0 = performance.now();
  try{
    const res = await fetch(url, {
      method,
      headers: body ? {'Content-Type':'application/json'} : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    const text = await res.text();
    const ms = Math.round(performance.now()-t0) + ' ms';
    log(res.ok ? 'in' : 'err', String(res.status), text ? pretty(text) : '(empty body)', ms);
    try { return JSON.parse(text) } catch { return null }
  }catch(e){
    log('err','FAIL', e.message + ' (server down, or CORS not enabled on the server)');
    return null;
  }
}

$('btnPing').onclick = () => http('GET','/ping');
$('btnCount').onclick = () => http('GET','/usercount');
$('btnReg').onclick = async () => {
  const u = await http('POST','/register',{name:$('name').value});
  if (u && u.id){ $('userId').value = u.id; log('sys','NOTE','User ID filled in below.'); }
};
$('btnGetUser').onclick = () => {
  const id = $('userId').value.trim();
  if (!id) return log('err','INPUT','Enter a user ID first.');
  http('GET','/user/' + encodeURIComponent(id));
};

/* ---------- WebSocket ---------- */
function connect(){
  const url = 'ws://' + $('host').value.trim() + '/ws';
  log('sys','WS','Connecting to ' + url);
  try { ws = new WebSocket(url) } catch(e){ return log('err','WS',e.message) }
  ws.onopen = () => { setConnected(true); log('sys','WS','Connected'); };
  ws.onclose = e => { setConnected(false); pending.clear(); log('sys','WS','Closed (code ' + e.code + ')'); ws = null; };
  ws.onerror = () => log('err','WS','Connection error. Is the server running on ' + $('host').value + '?');
  ws.onmessage = ev => {
    let msg = null;
    try { msg = JSON.parse(ev.data) } catch {}
    if (msg && typeof msg === 'object' && 'id' in msg && pending.has(msg.id)){
      const p = pending.get(msg.id); pending.delete(msg.id);
      const ms = Math.round(performance.now() - p.t0) + ' ms';
      log(msg.response === 'error' ? 'err' : 'in', 'reply', JSON.stringify(msg), p.label + ' ' + ms);
    } else if (msg) {
      log('push','push', JSON.stringify(msg));
    } else {
      log('push','push', ev.data + '  (not JSON)');
    }
  };
}
$('btnConnect').onclick = connect;
$('btnDisconnect').onclick = () => ws && ws.close();

function send(obj){
  if (!ws || ws.readyState !== WebSocket.OPEN) return log('err','WS','Not connected.');
  if (!('id' in obj)) obj = {id: ++seq, ...obj};
  else seq = Math.max(seq, obj.id);
  const label = obj.command + (obj.action && obj.action.action ? ':' + obj.action.action : '');
  pending.set(obj.id, {label, t0: performance.now()});
  const text = JSON.stringify(obj);
  log('out','send', text);
  ws.send(text);
}
const tableAction = a => send({command:'table', tableId:$('tableId').value.trim(), action:a});

$('btnSetAuth').onclick = () => send({command:'setAuthentication', userId:$('userId').value.trim()});
$('btnGetAuth').onclick = () => send({command:'getAuthentication'});
$('btnJoin').onclick = () => send({command:'joinTable', tableId:$('tableId').value.trim()});
$('btnLeave').onclick = () => send({command:'leaveTable'});
$('btnSit').onclick = () => tableAction({action:'sit', bankAmount:Number($('bank').value)});
$('btnStand').onclick = () => tableAction({action:'stand'});
$('btnBet').onclick = () => tableAction({action:'bet', betAmount:Number($('bet').value)});
$('btnFold').onclick = () => tableAction({action:'fold'});
$('btnNewTable').onclick = () => { $('tableId').value = crypto.randomUUID(); };

$('btnRaw').onclick = () => {
  let o; try { o = JSON.parse($('raw').value) } catch(e){ return log('err','INPUT','Raw message is not valid JSON: ' + e.message) }
  send(o);
};
$('btnBad').onclick = () => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return log('err','WS','Not connected.');
  log('out','send','{not json'); ws.send('{not json');
};

$('btnClear').onclick = () => { $('log').textContent = ''; };
if (location.protocol.startsWith('http')) $('host').value = location.host;
setConnected(false);
log('sys','READY','Set the host, then Connect or call the HTTP endpoints.');
</script>
</body>
</html>
